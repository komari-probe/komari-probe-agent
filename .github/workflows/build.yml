name: Build on Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Flatten binary names
        run: bash scripts/flatten-goreleaser-output.sh build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-binaries
          path: build/komari-agent-*
