version: 2

project_name: sonar-agent

dist: build

builds:
  - id: sonar-agent
    main: ./cmd/sonar-agent
    binary: sonar-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X github.com/sonar-probe/sonar-agent/internal/version.CurrentVersion={{ .Version }}
    goos:
      - windows
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
      - loong64
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: loong64
      - goos: darwin
        goarch: loong64
      - goos: freebsd
        goarch: loong64

archives:
  - id: sonar-agent
    ids:
      - sonar-agent
    formats:
      - binary
    name_template: "sonar-agent-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  disable: true
